[package]
name = "research-loop"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
repository = "https://github.com/Loop-Suite/research-loop"
description = "Multi-persona review + discourse cross-examination CLI for validating market/competitor research documents"

[[bin]]
name = "research"
path = "src/main.rs"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "1.1"
ureq = { version = "2", features = ["json"] }
regex = "1"
url = "2"
